name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: unzip -q snap_nooruddin.zip
      - working-directory: snap_nooruddin
        run: |
          flutter create --org com.nooruddin --project-name snap_nooruddin .
          cp android_manifest_notes/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: snap-nooruddin-apk
          path: snap_nooruddin/build/app/outputs/flutter-apk/app-release.apk
